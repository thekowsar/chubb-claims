# chubb-claims: API + Angular client (NFR-12, 05 §10).
# Settings come from .env (copy .env.example); every one has a default, so .env is optional.
#   docker compose up --build      -> app on http://localhost:4200, API + Swagger on http://localhost:8080
#   docker compose down            -> stops; H2 data survives in the claims-data volume
#   docker compose down -v         -> also wipes the database (re-seeded on next start)
name: chubb-claims

services:
  server:
    build: ./server
    image: chubb-claims-server:1.0.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Override in any shared environment; the default is for local demo only.
      JWT_SECRET: ${JWT_SECRET:-chubb-claims-docker-secret-change-me-0123456789abcdef}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Password123!}
      CORS_ALLOWED_ORIGINS: http://localhost:${CLIENT_PORT:-4200}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - claims-data:/app/data
    healthcheck:
      # No actuator: check the API port answers (bash is in the Ubuntu-based temurin image).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  client:
    build: ./client
    image: chubb-claims-client:1.0.0
    ports:
      - "${CLIENT_PORT:-4200}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  claims-data:
