server:
  port: 8080

spring:
  application:
    name: chubb-claims
  datasource:
    url: jdbc:h2:file:./data/db
    username: sa
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  jwt:
    # Override with env JWT_SECRET in any shared environment. Must be at least 32 bytes for HS256.
    secret: ${JWT_SECRET:chubb-claims-dev-secret-change-me-0123456789abcdef}
    expiration-seconds: 3600
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: true
    demo-password: ${SEED_DEMO_PASSWORD:Password123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5level [%X{correlationId:-}] %-40.40logger{39} : %msg%n%wEx"
  level:
    com.chubb.claims: INFO
