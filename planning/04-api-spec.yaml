openapi: 3.0.3
info:
  title: chubb-claims API
  version: 1.0.0
  description: |
    REST API for the chubb-claims platform. **This file is the source of truth** (CLAUDE.md, contract first).
    Swagger UI generated by springdoc must stay consistent with it.

    **Roles:** `CLAIMANT`, `CLAIMS_STAFF`, `MANAGER` (stored in the `roles` table, see 03-db-design §3.0).
    Each operation lists its allowed roles in its description and in the `x-roles` extension.

    **Envelope:** every response, success or error, uses the `ApiResponse` envelope
    (`success`, `data`, `error`, `timestamp`). The base is defined once in `components.schemas.ApiResponse`,
    and typed responses extend it with `allOf`.

    **Errors:** real HTTP status codes are always paired with a stable `error.code`:

    | HTTP | Codes |
    |---|---|
    | 400 | `VALIDATION_FAILED`, `INVALID_ASSIGNEE` |
    | 401 | `INVALID_CREDENTIALS` (login only), `UNAUTHORIZED` (missing, invalid or expired token) |
    | 403 | `ACCESS_DENIED` (wrong role, or the claim isn't assigned to the calling staff member) |
    | 404 | `CLAIM_NOT_FOUND` (also returned to a claimant who opens another claimant's claim), `NOT_FOUND` (no such route) |
    | 405 | `METHOD_NOT_ALLOWED` (the route exists but not for this HTTP method) |
    | 409 | `INVALID_STATUS_TRANSITION`, `MESSAGING_NOT_ALLOWED`, `CONCURRENT_MODIFICATION` |
    | 500 | `INTERNAL_ERROR` (generic message only; detail goes to the ERROR log) |

    Checks run in this order: 401, 403 (role), 400 (body validation), 404, 403 (ownership), 409, 400 (business rules).

    **Correlation id:** send `X-Correlation-Id` if you have one. Otherwise the server generates one, and it is
    always echoed in the response header.

    **Time:** all timestamps are ISO-8601 in UTC. `incidentDate`, `submittedFrom` and `submittedTo` are dates (`YYYY-MM-DD`).
servers:
  - url: http://localhost:8080
    description: Local / docker-compose
tags:
  - { name: Auth, description: 'Login and current user' }
  - { name: Menu, description: 'Role menu from the database (roles, menus, role_menu)' }
  - { name: Claims, description: 'Create, list, view and history' }
  - { name: Claim workflow, description: 'Status changes (assign, start, assess, settle, reject)' }
  - { name: Messages, description: 'Claimant and staff conversation while IN_PROGRESS' }
  - { name: Users, description: 'User lookup for assignment' }
  - { name: Dashboard, description: 'Manager workload and liability' }
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with username and password and get a JWT
      description: "Public. Roles: none required. Related: FR-02, US-01."
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: manager1, password: "<demo password>" }
      responses:
        '200':
          description: Logged in
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginApiResponse' }
              example:
                success: true
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI1Iiwicm9sZSI6Ik1BTkFHRVIifQ.signature
                  tokenType: Bearer
                  expiresIn: 3600
                  user: { id: 5, username: manager1, displayName: Evan Lee, role: MANAGER }
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong username or password. The same response is returned for an unknown user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApiResponse' }
              example:
                success: false
                data: null
                error: { code: INVALID_CREDENTIALS, message: Invalid username or password, details: [] }
                timestamp: '2026-11-25T09:30:00Z'
        '500': { $ref: '#/components/responses/InternalError' }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the logged-in user (restore the session on refresh)
      description: "Roles: CLAIMANT, CLAIMS_STAFF, MANAGER. Related: FR-05."
      x-roles: [CLAIMANT, CLAIMS_STAFF, MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current user
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserApiResponse' }
              example:
                success: true
                data: { id: 1, username: claimant1, displayName: Alice Tan, role: CLAIMANT }
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/menu:
    get:
      tags: [Menu]
      operationId: getMyMenu
      summary: Get the menu for the caller's role (from roles, menus and role_menu)
      description: |
        Roles: CLAIMANT, CLAIMS_STAFF, MANAGER. Returns only the caller's enabled menu items, ordered by `sortOrder`.
        The first item is the role's home page. The menu controls what is shown, not access. Related: FR-06, FR-25, P16.
      x-roles: [CLAIMANT, CLAIMS_STAFF, MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Menu items in display order
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuListApiResponse' }
              example:
                success: true
                data:
                  - { code: DASHBOARD, label: Dashboard, route: /manager/dashboard, icon: dashboard, sortOrder: 10 }
                  - { code: ALL_CLAIMS, label: All claims, route: /manager/claims, icon: list, sortOrder: 20 }
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims:
    get:
      tags: [Claims]
      operationId: searchClaims
      summary: List claims with filters, sorting and pagination (scoped by role)
      description: |
        Roles: CLAIMANT (own claims only), CLAIMS_STAFF (claims assigned to me only), MANAGER (all claims).
        The role scope is applied on the server **before** the filters, so query parameters can't widen it.
        Filters are combined with AND. Related: FR-08, FR-10, FR-13, FR-23, US-04, US-07, US-10, P4.
      x-roles: [CLAIMANT, CLAIMS_STAFF, MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          description: Filter by one or more statuses. Repeat the parameter (`status=ASSIGNED&status=IN_PROGRESS`).
          schema:
            type: array
            items: { $ref: '#/components/schemas/ClaimStatus' }
          style: form
          explode: true
        - name: market
          in: query
          schema: { $ref: '#/components/schemas/Market' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ClaimType' }
        - name: submittedFrom
          in: query
          description: Submitted date from (inclusive, UTC), compared with `createdAt`
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: submittedTo
          in: query
          description: Submitted date to (inclusive, up to the end of that day in UTC). Must be on or after `submittedFrom`.
          schema: { type: string, format: date, example: '2026-11-30' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ClaimSort'
      responses:
        '200':
          description: One page of claims
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPageApiResponse' }
              example:
                success: true
                data:
                  items:
                    - id: 4
                      claimNumber: CLM-2026-000004
                      type: MOTOR
                      market: MY
                      status: IN_PROGRESS
                      incidentDate: '2026-11-10'
                      estimatedAmount: 6200.00
                      currency: MYR
                      claimant: { id: 2, displayName: Ben Wong }
                      assignedStaff: { id: 3, displayName: Chris Lim }
                      createdAt: '2026-11-11T02:15:00Z'
                      updatedAt: '2026-11-20T08:00:00Z'
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Claims]
      operationId: createClaim
      summary: Submit a new claim (status SUBMITTED)
      description: |
        Roles: CLAIMANT. The claimant is taken from the token and never from the body. `currency` defaults to the market's currency.
        Related: FR-07, FR-19, US-03, P3.
      x-roles: [CLAIMANT]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClaimRequest' }
            example:
              type: MOTOR
              market: SG
              policyNumber: POL-SG-778812
              incidentDate: '2026-11-20'
              location: Orchard Road, Singapore
              description: Rear-ended at a traffic light. Bumper and tail light damaged.
              estimatedAmount: 4500.00
              currency: SGD
      responses:
        '201':
          description: Claim created
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
            Location:
              description: URL of the new claim
              schema: { type: string, example: /api/claims/9 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetailApiResponse' }
              example:
                success: true
                data:
                  id: 9
                  claimNumber: CLM-2026-000009
                  type: MOTOR
                  market: SG
                  policyNumber: POL-SG-778812
                  incidentDate: '2026-11-20'
                  location: Orchard Road, Singapore
                  description: Rear-ended at a traffic light. Bumper and tail light damaged.
                  estimatedAmount: 4500.00
                  currency: SGD
                  status: SUBMITTED
                  claimant: { id: 1, displayName: Alice Tan }
                  assignedStaff: null
                  assessedAmount: null
                  settledAmount: null
                  decisionNote: null
                  createdAt: '2026-11-25T09:30:00Z'
                  updatedAt: '2026-11-25T09:30:00Z'
                  assignedAt: null
                  startedAt: null
                  closedAt: null
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApiResponse' }
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed
                  details:
                    - { field: incidentDate, message: must not be in the future }
                    - { field: estimatedAmount, message: must be greater than 0 }
                timestamp: '2026-11-25T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}:
    get:
      tags: [Claims]
      operationId: getClaim
      summary: Get claim detail
      description: |
        Roles: CLAIMANT (own claim; another claimant's claim returns 404), CLAIMS_STAFF (assigned to me; otherwise 403), MANAGER (any).
        Related: FR-08, US-04, US-06, P5.
      x-roles: [CLAIMANT, CLAIMS_STAFF, MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim detail
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetailApiResponse' }
              example:
                success: true
                data:
                  id: 6
                  claimNumber: CLM-2026-000006
                  type: PROPERTY
                  market: TH
                  policyNumber: POL-TH-120044
                  incidentDate: '2026-10-28'
                  location: Sukhumvit, Bangkok
                  description: Water damage from a burst pipe in the kitchen.
                  estimatedAmount: 150000.00
                  currency: THB
                  status: SETTLED
                  claimant: { id: 2, displayName: Ben Wong }
                  assignedStaff: { id: 4, displayName: Dana Ng }
                  assessedAmount: 140000.00
                  settledAmount: 135000.00
                  decisionNote: Covered under section 2. Deductible applied.
                  createdAt: '2026-10-29T03:00:00Z'
                  updatedAt: '2026-11-12T06:30:00Z'
                  assignedAt: '2026-10-30T01:00:00Z'
                  startedAt: '2026-10-31T02:00:00Z'
                  closedAt: '2026-11-12T06:30:00Z'
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}/assignment:
    put:
      tags: [Claim workflow]
      operationId: assignClaim
      summary: Assign or reassign a claim to a staff member (SUBMITTED/ASSIGNED to ASSIGNED)
      description: |
        Roles: MANAGER. Allowed only while the claim is SUBMITTED or ASSIGNED. The target must be an enabled CLAIMS_STAFF user.
        Related: FR-12, US-08, P7.
      x-roles: [MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignClaimRequest' }
            example: { staffId: 3 }
      responses:
        '200': { $ref: '#/components/responses/ClaimDetailOk' }
        '400':
          description: Validation failed, or the target user isn't CLAIMS_STAFF
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApiResponse' }
              example:
                success: false
                data: null
                error: { code: INVALID_ASSIGNEE, message: User 5 is not a claims staff member, details: [] }
                timestamp: '2026-11-25T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}/start:
    post:
      tags: [Claim workflow]
      operationId: startClaim
      summary: Start work on an assigned claim (ASSIGNED to IN_PROGRESS)
      description: "Roles: CLAIMS_STAFF (assigned staff only). No request body. Related: FR-14, US-11, P8."
      x-roles: [CLAIMS_STAFF]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200': { $ref: '#/components/responses/ClaimDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}/assessment:
    patch:
      tags: [Claim workflow]
      operationId: assessClaim
      summary: Set or update the assessed amount (IN_PROGRESS only)
      description: "Roles: CLAIMS_STAFF (assigned staff only). Status doesn't change. Related: FR-15, US-12, P9."
      x-roles: [CLAIMS_STAFF]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessClaimRequest' }
            example: { assessedAmount: 5800.00 }
      responses:
        '200': { $ref: '#/components/responses/ClaimDetailOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}/settle:
    post:
      tags: [Claim workflow]
      operationId: settleClaim
      summary: Settle a claim (IN_PROGRESS to SETTLED)
      description: |
        Roles: CLAIMS_STAFF (assigned staff only). Uses the stored `assessedAmount`, which must already be set.
        `settledAmount` must be greater than 0 and no more than `assessedAmount`. `decisionNote` is required. Related: FR-16, US-13, P12.
      x-roles: [CLAIMS_STAFF]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettleClaimRequest' }
            example: { settledAmount: 5500.00, decisionNote: Approved. Repair quote verified; excess of MYR 300 applied. }
      responses:
        '200': { $ref: '#/components/responses/ClaimDetailOk' }
        '400':
          description: Validation failed, or a business rule failed (no assessed amount, or settled is more than assessed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApiResponse' }
              example:
                success: false
                data: null
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed
                  details:
                    - { field: settledAmount, message: must not exceed assessed amount 5800.00 }
                timestamp: '2026-11-25T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}/reject:
    post:
      tags: [Claim workflow]
      operationId: rejectClaim
      summary: Reject a claim (IN_PROGRESS to REJECTED)
      description: "Roles: CLAIMS_STAFF (assigned staff only). `decisionNote` is required. Related: FR-16, US-14, P13."
      x-roles: [CLAIMS_STAFF]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectClaimRequest' }
            example: { decisionNote: Incident occurred before the policy start date. }
      responses:
        '200': { $ref: '#/components/responses/ClaimDetailOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}/messages:
    get:
      tags: [Messages]
      operationId: listClaimMessages
      summary: Read the claim's messages (oldest first)
      description: |
        Roles: CLAIMANT (own claim), CLAIMS_STAFF (assigned to me), MANAGER (any, read only). Works in any status.
        Related: FR-09, US-05, US-12, P10.
      x-roles: [CLAIMANT, CLAIMS_STAFF, MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Messages, oldest first
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListApiResponse' }
              example:
                success: true
                data:
                  - { id: 1, author: { id: 3, displayName: Chris Lim }, authorRole: CLAIMS_STAFF, body: Please upload the workshop repair quote reference number., createdAt: '2026-11-18T03:00:00Z' }
                  - { id: 2, author: { id: 2, displayName: Ben Wong }, authorRole: CLAIMANT, body: The quote reference is WS-88412., createdAt: '2026-11-18T09:12:00Z' }
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Messages]
      operationId: sendClaimMessage
      summary: Send a message (IN_PROGRESS only)
      description: |
        Roles: CLAIMANT (own claim), CLAIMS_STAFF (assigned to me). MANAGER can't send messages (403).
        In any status other than IN_PROGRESS the response is 409 `MESSAGING_NOT_ALLOWED`. Related: FR-09, US-05, US-12, P11.
      x-roles: [CLAIMANT, CLAIMS_STAFF]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
            example: { body: The quote reference is WS-88412. }
      responses:
        '201':
          description: Message created
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageApiResponse' }
              example:
                success: true
                data: { id: 2, author: { id: 2, displayName: Ben Wong }, authorRole: CLAIMANT, body: The quote reference is WS-88412., createdAt: '2026-11-18T09:12:00Z' }
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '409':
          description: Claim is not IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorApiResponse' }
              example:
                success: false
                data: null
                error: { code: MESSAGING_NOT_ALLOWED, message: Messages can only be sent while the claim is IN_PROGRESS, details: [] }
                timestamp: '2026-11-25T09:30:00Z'
        '500': { $ref: '#/components/responses/InternalError' }

  /api/claims/{id}/history:
    get:
      tags: [Claims]
      operationId: getClaimHistory
      summary: Status history of a claim (oldest first)
      description: |
        Roles: CLAIMANT (own claim), CLAIMS_STAFF (assigned to me), MANAGER (any). Feeds the timeline UI (FR-21, could-have).
        Related: FR-20 (should-have, built as core per 03 D2).
      x-roles: [CLAIMANT, CLAIMS_STAFF, MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: History rows, oldest first
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusHistoryListApiResponse' }
              example:
                success: true
                data:
                  - { fromStatus: null, toStatus: SUBMITTED, changedBy: { id: 2, displayName: Ben Wong }, assignedStaff: null, changedAt: '2026-11-11T02:15:00Z' }
                  - { fromStatus: SUBMITTED, toStatus: ASSIGNED, changedBy: { id: 5, displayName: Evan Lee }, assignedStaff: { id: 3, displayName: Chris Lim }, changedAt: '2026-11-12T01:00:00Z' }
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users by role (used for the staff picker when assigning)
      description: "Roles: MANAGER. Returns enabled users only, sorted by display name. Related: FR-11, US-08, P6."
      x-roles: [MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: role
          in: query
          required: true
          description: Role code to filter by. Only `CLAIMS_STAFF` is needed now.
          schema: { $ref: '#/components/schemas/RoleCode' }
          example: CLAIMS_STAFF
      responses:
        '200':
          description: Users with the given role
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListApiResponse' }
              example:
                success: true
                data:
                  - { id: 3, username: staff1, displayName: Chris Lim, role: CLAIMS_STAFF }
                  - { id: 4, username: staff2, displayName: Dana Ng, role: CLAIMS_STAFF }
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Manager dashboard with workload, counts and outstanding liability
      description: |
        Roles: MANAGER. Calculated from the database on every call.

        **`period`** selects the reporting window: `WEEK` (this calendar week, from Monday 00:00 UTC),
        `MONTH` (this calendar month, from the 1st 00:00 UTC) or `ALL` (all time, the default). The window always ends now.

        | Figure | Affected by `period`? | Rule |
        |---|---|---|
        | `countsByStatus` | Yes | Claims **submitted** in the window (`createdAt`), grouped by current status |
        | `submittedCount` | Yes | Claims submitted in the window |
        | `settledTotals` | Yes | Claims **settled** in the window (`closedAt`), by currency |
        | `closedCounts` | Yes | Claims settled and rejected in the window (`closedAt`) |
        | `unassignedCount` | No, current snapshot | Claims in SUBMITTED now |
        | `workload` | No, current snapshot | Open claims per staff member now |
        | `outstandingLiability` | No, current snapshot | Sum of `COALESCE(assessedAmount, estimatedAmount)` over open claims (SUBMITTED, ASSIGNED, IN_PROGRESS) now, by market and currency, with no conversion |

        Liability and workload describe the current exposure, so they don't change with the period.
        Related: FR-18, US-09, P14.
      x-roles: [MANAGER]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: period
          in: query
          required: false
          description: Reporting window for the period-based figures. An invalid value returns 400 `VALIDATION_FAILED`.
          schema: { $ref: '#/components/schemas/DashboardPeriod' }
          example: MONTH
      responses:
        '200':
          description: Dashboard figures
          headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardApiResponse' }
              example:
                success: true
                data:
                  period: ALL
                  periodFrom: null
                  periodTo: '2026-11-25T09:30:00Z'
                  submittedCount: 8
                  closedCounts: { settled: 2, rejected: 1 }
                  unassignedCount: 2
                  countsByStatus:
                    - { status: SUBMITTED, count: 2 }
                    - { status: ASSIGNED, count: 1 }
                    - { status: IN_PROGRESS, count: 2 }
                    - { status: SETTLED, count: 2 }
                    - { status: REJECTED, count: 1 }
                  workload:
                    - { staff: { id: 3, displayName: Chris Lim }, assignedCount: 1, inProgressCount: 1 }
                    - { staff: { id: 4, displayName: Dana Ng }, assignedCount: 0, inProgressCount: 1 }
                  outstandingLiability:
                    - { market: SG, currency: SGD, amount: 7500.00, openClaimCount: 2 }
                    - { market: HK, currency: HKD, amount: 80000.00, openClaimCount: 1 }
                    - { market: AU, currency: AUD, amount: 12000.00, openClaimCount: 1 }
                    - { market: MY, currency: MYR, amount: 5800.00, openClaimCount: 1 }
                  settledTotals:
                    - { currency: THB, amount: 135000.00 }
                    - { currency: SGD, amount: 1800.00 }
                  generatedAt: '2026-11-25T09:30:00Z'
                error: null
                timestamp: '2026-11-25T09:30:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HS256 JWT from POST /api/auth/login. Claims: sub (user id), username, role. It expires after 60 minutes."

  headers:
    X-Correlation-Id:
      description: Correlation id for this request (echoed from the request or generated by the server)
      schema: { type: string, example: 7f3c2a9e-1b4d-4c8a-9e21-5d0f6a7b8c90 }

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional client correlation id. If missing, the server generates one.
      schema: { type: string, maxLength: 64 }
    ClaimId:
      name: id
      in: path
      required: true
      description: Claim id
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      description: Page number, starting at 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ClaimSort:
      name: sort
      in: query
      description: |
        Sort as `field,direction`. Allowed fields: `createdAt`, `updatedAt`, `incidentDate`, `estimatedAmount`, `claimNumber`, `status`.
        Direction is `asc` or `desc`. The default is `createdAt,desc`. An unknown field returns 400 `VALIDATION_FAILED`.
      schema:
        type: string
        pattern: '^(createdAt|updatedAt|incidentDate|estimatedAmount|claimNumber|status),(asc|desc)$'
        default: createdAt,desc
        example: createdAt,desc

  responses:
    ClaimDetailOk:
      description: Updated claim
      headers: { X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ClaimDetailApiResponse' }
    BadRequest:
      description: Validation failed (`VALIDATION_FAILED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApiResponse' }
          example:
            success: false
            data: null
            error:
              code: VALIDATION_FAILED
              message: Request validation failed
              details:
                - { field: decisionNote, message: must not be blank }
            timestamp: '2026-11-25T09:30:00Z'
    Unauthorized:
      description: Missing, invalid or expired token (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApiResponse' }
          example:
            success: false
            data: null
            error: { code: UNAUTHORIZED, message: Authentication required, details: [] }
            timestamp: '2026-11-25T09:30:00Z'
    Forbidden:
      description: Role not allowed, or the claim isn't assigned to the calling staff member (`ACCESS_DENIED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApiResponse' }
          example:
            success: false
            data: null
            error: { code: ACCESS_DENIED, message: You are not allowed to perform this action, details: [] }
            timestamp: '2026-11-25T09:30:00Z'
    ClaimNotFound:
      description: Claim not found, or not visible to this claimant (`CLAIM_NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApiResponse' }
          example:
            success: false
            data: null
            error: { code: CLAIM_NOT_FOUND, message: Claim 42 not found, details: [] }
            timestamp: '2026-11-25T09:30:00Z'
    Conflict:
      description: Invalid status transition (`INVALID_STATUS_TRANSITION`) or a concurrent update (`CONCURRENT_MODIFICATION`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApiResponse' }
          examples:
            invalidTransition:
              value:
                success: false
                data: null
                error: { code: INVALID_STATUS_TRANSITION, message: Cannot move claim from SETTLED to REJECTED, details: [] }
                timestamp: '2026-11-25T09:30:00Z'
            concurrentModification:
              value:
                success: false
                data: null
                error: { code: CONCURRENT_MODIFICATION, message: Claim was changed by another user. Reload and try again., details: [] }
                timestamp: '2026-11-25T09:30:00Z'
    InternalError:
      description: Unexpected error (`INTERNAL_ERROR`). Generic message only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorApiResponse' }
          example:
            success: false
            data: null
            error: { code: INTERNAL_ERROR, message: An unexpected error occurred, details: [] }
            timestamp: '2026-11-25T09:30:00Z'

  schemas:
    # ---------- Envelope (defined once) ----------
    ApiResponse:
      type: object
      description: Common envelope for every response. Typed responses extend it with allOf and set `data`.
      required: [success, data, error, timestamp]
      properties:
        success: { type: boolean }
        data:
          description: Payload on success (object or array), null on failure. Each typed response sets its schema.
        error: { $ref: '#/components/schemas/ApiError' }
        timestamp: { type: string, format: date-time }
    ApiError:
      type: object
      nullable: true
      description: Null on success
      required: [code, message, details]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [message]
      properties:
        field: { type: string, nullable: true, example: estimatedAmount }
        message: { type: string, example: must be greater than 0 }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - INVALID_ASSIGNEE
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - ACCESS_DENIED
        - CLAIM_NOT_FOUND
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INVALID_STATUS_TRANSITION
        - MESSAGING_NOT_ALLOWED
        - CONCURRENT_MODIFICATION
        - INTERNAL_ERROR
    ErrorApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            success: { type: boolean, enum: [false] }
            data: { description: Always null on failure }

    # ---------- Typed envelopes ----------
    LoginApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/LoginResponse' } }
    CurrentUserApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/UserDto' } }
    MenuListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/MenuItemDto' } }
    ClaimPageApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/ClaimSummaryPage' } }
    ClaimDetailApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/ClaimDetailDto' } }
    MessageApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/MessageDto' } }
    MessageListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/MessageDto' } }
    StatusHistoryListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/StatusHistoryDto' } }
    UserListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/UserDto' } }
    DashboardApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/DashboardDto' } }

    # ---------- Enums ----------
    RoleCode:
      type: string
      description: Role code. Matches `roles.code` in the database.
      enum: [CLAIMANT, CLAIMS_STAFF, MANAGER]
    ClaimStatus:
      type: string
      enum: [SUBMITTED, ASSIGNED, IN_PROGRESS, SETTLED, REJECTED]
    ClaimType:
      type: string
      enum: [MOTOR, PROPERTY]
    Market:
      type: string
      enum: [SG, HK, AU, MY, TH, ID]
    Currency:
      type: string
      enum: [SGD, HKD, AUD, MYR, THB, IDR]
    DashboardPeriod:
      type: string
      enum: [WEEK, MONTH, ALL]
      default: ALL
      description: 'WEEK = this calendar week from Monday 00:00 UTC. MONTH = this calendar month from the 1st 00:00 UTC. ALL = all time.'
    Money:
      type: number
      format: decimal
      description: Amount with 2 decimal places
      multipleOf: 0.01
      example: 4500.00

    # ---------- Auth / user / menu DTOs ----------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        password: { type: string, format: password, minLength: 1, maxLength: 100, writeOnly: true }
    LoginResponse:
      type: object
      required: [token, tokenType, expiresIn, user]
      properties:
        token: { type: string, description: JWT }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Seconds until expiry, example: 3600 }
        user: { $ref: '#/components/schemas/UserDto' }
    UserDto:
      type: object
      required: [id, username, displayName, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/RoleCode' }
    UserRef:
      type: object
      description: Short user reference for embedding in other DTOs
      required: [id, displayName]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
    NullableUserRef:
      type: object
      nullable: true
      description: UserRef, or null when not set (e.g. no staff assigned yet)
      required: [id, displayName]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
    MenuItemDto:
      type: object
      required: [code, label, route, sortOrder]
      properties:
        code: { type: string, example: MY_CLAIMS }
        label: { type: string, example: My claims }
        route: { type: string, example: /claimant/claims }
        icon: { type: string, nullable: true, example: list }
        sortOrder: { type: integer, example: 10 }

    # ---------- Claim DTOs ----------
    CreateClaimRequest:
      type: object
      required: [type, market, policyNumber, incidentDate, location, description, estimatedAmount]
      properties:
        type: { $ref: '#/components/schemas/ClaimType' }
        market: { $ref: '#/components/schemas/Market' }
        policyNumber: { type: string, minLength: 1, maxLength: 30 }
        incidentDate: { type: string, format: date, description: Must not be in the future }
        location: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        estimatedAmount:
          type: number
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          minimum: 0.01
        currency:
          allOf: [ { $ref: '#/components/schemas/Currency' } ]
          description: Optional. Defaults to the market's currency (SG to SGD, HK to HKD, and so on).
    AssignClaimRequest:
      type: object
      required: [staffId]
      properties:
        staffId: { type: integer, format: int64, minimum: 1 }
    AssessClaimRequest:
      type: object
      required: [assessedAmount]
      properties:
        assessedAmount:
          type: number
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          minimum: 0
    SettleClaimRequest:
      type: object
      required: [settledAmount, decisionNote]
      properties:
        settledAmount:
          type: number
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          minimum: 0.01
          description: Must be no more than the stored assessedAmount
        decisionNote: { type: string, minLength: 1, maxLength: 2000 }
    RejectClaimRequest:
      type: object
      required: [decisionNote]
      properties:
        decisionNote: { type: string, minLength: 1, maxLength: 2000 }
    ClaimSummaryDto:
      type: object
      description: Row in a claim list
      required: [id, claimNumber, type, market, status, incidentDate, estimatedAmount, currency, claimant, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        claimNumber: { type: string, example: CLM-2026-000004 }
        type: { $ref: '#/components/schemas/ClaimType' }
        market: { $ref: '#/components/schemas/Market' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        incidentDate: { type: string, format: date }
        estimatedAmount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        claimant: { $ref: '#/components/schemas/UserRef' }
        assignedStaff:
          $ref: '#/components/schemas/NullableUserRef'
        createdAt: { type: string, format: date-time, description: Submitted date }
        updatedAt: { type: string, format: date-time }
    ClaimDetailDto:
      type: object
      required: [id, claimNumber, type, market, policyNumber, incidentDate, location, description, estimatedAmount, currency, status, claimant, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        claimNumber: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        market: { $ref: '#/components/schemas/Market' }
        policyNumber: { type: string }
        incidentDate: { type: string, format: date }
        location: { type: string }
        description: { type: string }
        estimatedAmount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        claimant: { $ref: '#/components/schemas/UserRef' }
        assignedStaff:
          $ref: '#/components/schemas/NullableUserRef'
        assessedAmount:
          type: number
          format: decimal
          multipleOf: 0.01
          nullable: true
        settledAmount:
          type: number
          format: decimal
          multipleOf: 0.01
          nullable: true
        decisionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        assignedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
    ClaimSummaryPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClaimSummaryDto' } }
        page: { type: integer, description: 'Current page, starting at 0' }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    MessageDto:
      type: object
      required: [id, author, authorRole, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/UserRef' }
        authorRole:
          allOf: [ { $ref: '#/components/schemas/RoleCode' } ]
          description: Taken from the author's role in `roles`
        body: { type: string }
        createdAt: { type: string, format: date-time }
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    StatusHistoryDto:
      type: object
      required: [toStatus, changedBy, changedAt]
      properties:
        fromStatus:
          type: string
          nullable: true
          enum: [SUBMITTED, ASSIGNED, IN_PROGRESS, SETTLED, REJECTED, null]
        toStatus: { $ref: '#/components/schemas/ClaimStatus' }
        changedBy: { $ref: '#/components/schemas/UserRef' }
        assignedStaff:
          $ref: '#/components/schemas/NullableUserRef'
        changedAt: { type: string, format: date-time }

    # ---------- Dashboard DTOs ----------
    DashboardDto:
      type: object
      required: [period, periodTo, submittedCount, closedCounts, unassignedCount, countsByStatus, workload, outstandingLiability, settledTotals, generatedAt]
      properties:
        period: { $ref: '#/components/schemas/DashboardPeriod' }
        periodFrom: { type: string, format: date-time, nullable: true, description: 'Window start (UTC). Null for ALL.' }
        periodTo: { type: string, format: date-time, description: Window end (now) }
        submittedCount: { type: integer, description: Claims submitted in the window }
        closedCounts:
          type: object
          description: Claims closed in the window (by closedAt)
          required: [settled, rejected]
          properties:
            settled: { type: integer }
            rejected: { type: integer }
        unassignedCount: { type: integer, description: 'Claims in SUBMITTED now (snapshot, not affected by period)' }
        countsByStatus:
          type: array
          description: Claims submitted in the window, grouped by their current status
          items:
            type: object
            required: [status, count]
            properties:
              status: { $ref: '#/components/schemas/ClaimStatus' }
              count: { type: integer }
        workload:
          type: array
          description: 'Snapshot, not affected by period. One row per enabled CLAIMS_STAFF user, including users with zero claims.'
          items:
            type: object
            required: [staff, assignedCount, inProgressCount]
            properties:
              staff: { $ref: '#/components/schemas/UserRef' }
              assignedCount: { type: integer }
              inProgressCount: { type: integer }
        outstandingLiability:
          type: array
          description: 'Snapshot, not affected by period'
          items:
            type: object
            required: [market, currency, amount, openClaimCount]
            properties:
              market: { $ref: '#/components/schemas/Market' }
              currency: { $ref: '#/components/schemas/Currency' }
              amount: { $ref: '#/components/schemas/Money' }
              openClaimCount: { type: integer }
        settledTotals:
          type: array
          description: Settled amounts for claims settled in the window (by closedAt)
          items:
            type: object
            required: [currency, amount]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              amount: { $ref: '#/components/schemas/Money' }
        generatedAt: { type: string, format: date-time }
