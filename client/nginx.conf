# nginx for the Angular SPA (05 §10.3). The browser only talks to this origin, so no CORS is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # API: forward to the Spring Boot container by its compose service name.
    # Authorization and X-Correlation-Id are passed through unchanged (nginx forwards request headers by default).
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed bundles never change, so cache them for a long time.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new build is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for deep links such as /staff/claims/4.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
